<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Todo App</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: #f5f6fa;
      color: #333;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 30px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .input-area {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    #todoInput {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    #categorySelect {
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      background: white;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 15px;
      cursor: pointer;
      font-size: 14px;
    }

    #addButton {
      background: #4f46e5;
      color: white;
    }

    #addButton:hover {
      opacity: 0.85;
    }

    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .filter-tab {
      background: #e5e7eb;
      color: #333;
    }

    .filter-tab.active {
      background: #4f46e5;
      color: white;
    }

    #todoList {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      margin-bottom: 10px;
      background: #f8f8fb;
      border-radius: 8px;
    }

    .todo-text {
      flex: 1;
      cursor: pointer;
    }

    .completed {
      text-decoration: line-through;
      color: #999;
    }

    .category-badge {
      flex-shrink: 0;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .badge-work {
      background: #dbeafe;
      color: #1d4ed8;
    }

    .badge-private {
      background: #fce7f3;
      color: #be185d;
    }

    .badge-none {
      background: #e5e7eb;
      color: #6b7280;
    }

    .category-select {
      flex-shrink: 0;
      padding: 6px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      background: white;
    }

    .delete-button {
      background: #ef4444;
      color: white;
    }

    .empty-message {
      text-align: center;
      color: #999;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>📝 My Todo</h1>

    <div class="input-area">
      <input
        type="text"
        id="todoInput"
        placeholder="Todoを入力してください"
      >
      <select id="categorySelect" aria-label="分類">
        <option value="private" selected>プライベート用</option>
        <option value="work">仕事用</option>
      </select>
      <button id="addButton">追加</button>
    </div>

    <div class="filter-tabs" role="group" aria-label="分類で絞り込む">
      <button class="filter-tab active" data-filter="all">すべて</button>
      <button class="filter-tab" data-filter="work">仕事用</button>
      <button class="filter-tab" data-filter="private">プライベート用</button>
      <button class="filter-tab" data-filter="none">未設定</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script>
    // Todoデータ
    let todos = JSON.parse(localStorage.getItem("todos")) || [];

    // 現在の絞り込み（all / work / private / none）
    let currentFilter = "all";

    const todoInput = document.getElementById("todoInput");
    const categorySelect = document.getElementById("categorySelect");
    const addButton = document.getElementById("addButton");
    const todoList = document.getElementById("todoList");
    const filterTabs = document.querySelectorAll(".filter-tab");

    // 分類を取り出す（work / private 以外は未設定として扱う）
    function categoryOf(todo) {
      return todo.category === "work" || todo.category === "private"
        ? todo.category
        : "";
    }

    function categoryLabel(category) {
      if (category === "work") return "仕事用";
      if (category === "private") return "プライベート用";
      return "未設定";
    }

    // Todoを保存
    function saveTodos() {
      localStorage.setItem("todos", JSON.stringify(todos));
    }

    // Todoを表示
    function renderTodos() {
      todoList.innerHTML = "";

      if (todos.length === 0) {
        todoList.innerHTML =
          '<li class="empty-message">Todoはありません</li>';
        return;
      }

      const filteredTodos = todos.filter((todo) => {
        if (currentFilter === "all") return true;
        if (currentFilter === "none") return categoryOf(todo) === "";
        return categoryOf(todo) === currentFilter;
      });

      if (filteredTodos.length === 0) {
        todoList.innerHTML =
          '<li class="empty-message">この分類のTodoはありません</li>';
        return;
      }

      filteredTodos.forEach((todo) => {
        const li = document.createElement("li");
        li.className = "todo-item";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.completed;

        checkbox.addEventListener("change", () => {
          todo.completed = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const span = document.createElement("span");
        span.className = "todo-text";

        if (todo.completed) {
          span.classList.add("completed");
        }

        span.textContent = todo.text;

        const category = categoryOf(todo);

        const badge = document.createElement("span");
        badge.className =
          "category-badge " +
          (category === "work"
            ? "badge-work"
            : category === "private"
              ? "badge-private"
              : "badge-none");
        badge.textContent = categoryLabel(category);

        // 項目ごとに分類を変更できるセレクト
        const itemCategorySelect = document.createElement("select");
        itemCategorySelect.className = "category-select";
        itemCategorySelect.setAttribute("aria-label", "分類を変更");

        [
          { value: "", label: "未設定" },
          { value: "work", label: "仕事用" },
          { value: "private", label: "プライベート用" }
        ].forEach((optionData) => {
          const option = document.createElement("option");
          option.value = optionData.value;
          option.textContent = optionData.label;
          itemCategorySelect.appendChild(option);
        });
        itemCategorySelect.value = category;

        itemCategorySelect.addEventListener("change", () => {
          todo.category = itemCategorySelect.value;
          saveTodos();
          renderTodos();
        });

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "削除";
        deleteButton.className = "delete-button";

        deleteButton.addEventListener("click", () => {
          todos = todos.filter((item) => item.id !== todo.id);
          saveTodos();
          renderTodos();
        });

        li.appendChild(checkbox);
        li.appendChild(span);
        li.appendChild(badge);
        li.appendChild(itemCategorySelect);
        li.appendChild(deleteButton);

        todoList.appendChild(li);
      });
    }

    // Todoを追加
    function addTodo() {
      const text = todoInput.value.trim();

      if (text === "") {
        alert("Todoを入力してください");
        return;
      }

      const newTodo = {
        id: Date.now(),
        text: text,
        completed: false,
        category: categorySelect.value
      };

      todos.push(newTodo);

      saveTodos();
      renderTodos();

      todoInput.value = "";
      todoInput.focus();
    }

    // 分類タブで絞り込む
    filterTabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        currentFilter = tab.dataset.filter;

        filterTabs.forEach((item) => item.classList.remove("active"));
        tab.classList.add("active");

        renderTodos();
      });
    });

    // 追加ボタン
    addButton.addEventListener("click", addTodo);

    // Enterキーでも追加
    todoInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addTodo();
      }
    });

    // 最初に表示
    renderTodos();
  </script>

</body>
</html>
